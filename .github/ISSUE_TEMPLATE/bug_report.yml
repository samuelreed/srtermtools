name: Bug report
description: Report a defect in one of the CLI tools
title: "bug: "
labels: ["bug"]
body:
  - type: dropdown
    id: tool
    attributes:
      label: Tool
      options:
        - daycounter.py
        - sitecheck.py
        - aqicheck.py
        - oldcal.py
        - calendar2remind.py
        - routerrebooter.py
    validations:
      required: true

  - type: textarea
    id: command
    attributes:
      label: Command run
      description: Paste the exact command and arguments
      placeholder: ./daycounter.py countdown 2026-12-25 Christmas
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Environment context
      description: OS, Python version, and any relevant config info (exclude secrets)
